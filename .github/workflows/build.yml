name: RyzeMCBE BedrockTool CI

on:
  push:
    branches:
      - master
      - 'fix/**'
    tags:
      - 'v*-ryze.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Verify authentication and CLI
        run: go test ./ui/cli ./utils/auth

  build-cli:
    name: CLI ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build CLI without private git-crypt keys
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          extension=""
          if [ "$GOOS" = "windows" ]; then extension=".exe"; fi
          go build -trimpath \
            -ldflags="-s -w -X github.com/bedrock-tool/bedrocktool/utils.Version=1.62.0-ryze.1 -X github.com/bedrock-tool/bedrocktool/utils.CmdName=bedrocktool" \
            -o "dist/bedrocktool-${GOOS}-${GOARCH}-1.62.0-ryze.1${extension}" \
            ./cmd/bedrocktool
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged RyzeMCBE release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            RyzeMCBE maintenance build based on BedrockTool 1.62.0.
            Fixes Microsoft device-code login in headless CLI and prevents
            nil-handler crashes. GPL-3.0 license and upstream attribution retained.
            Built from public source without private git-crypt keys.
            Download only if CI and the relevant server-side tests pass.
